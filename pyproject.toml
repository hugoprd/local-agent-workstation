[project]
name = "local-agent-workstation"
version = "0.1.0"
description = "a local agent architecture to help at work, at projects and at study, utilizing Ollama local models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "pypdf>=6.21.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
]